---
groups:
  - name: smart
    interval: 5m
    rules:
      # A disk asleep under -n standby emits no health_ok (Telegraf smart.go
      # v1.36.4), so a short lookback would go empty while a failing disk is
      # spun down and the alert would resolve and re-fire. last_over_time over
      # 24h (the lookback host.rules.yml uses) keeps the last known health
      # while the disk sleeps; a newer health_ok=1 sample resolves it as soon
      # as the disk recovers, and a removed disk is left to
      # SmartDeviceNotReporting. Telegraf's power tag (ACTIVE/IDLE/STANDBY)
      # changes between polls, so telegraf.conf drops it at source (tagexclude)
      # and each disk keeps one stable series; min by the stable tags still
      # collapses any other tag change into one alert per disk and stops it
      # restarting for:. A replaced disk's old serial_no series can still
      # hold its last value for up to 24h; that is accepted.
      - alert: SmartDeviceUnhealthy
        expr: |
          min by (host, device, model, serial_no) (
            last_over_time(smart_device_health_ok[24h])
          ) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART health check failed for {{ $labels.device }} on {{ $labels.host }}"
          description: "{{ $labels.device }} ({{ $labels.model }} {{ $labels.serial_no }}) on {{ $labels.host }} failed its SMART overall health check."

      # A drive that drops off the bus disappears from smartctl --scan, so
      # Telegraf stops emitting smart_device for it and SmartDeviceUnhealthy
      # only holds its last health value for up to 24h, which says nothing
      # about the disk having stopped reporting; this rule flags that.
      # Presence is keyed on exit_status, not health_ok: Telegraf (smart.go
      # v1.36.4) always adds exit_status for every scanned device, but a disk
      # asleep under -n standby makes smartctl exit before the health line,
      # so health_ok is absent and keying on it would alert on every idle
      # spun-down disk.
      # (SmartDeviceUnhealthy holds the last health_ok while a disk sleeps,
      # which cannot raise a false alert.) Standby points also lack the model and
      # serial_no tags, because smartctl exits before printing identity (the
      # power tag that flips with the disk's state is dropped at source in
      # telegraf.conf), so both sides aggregate to (host, device) only. The
      # window is a device seen in the last 24h (the lookback host.rules.yml
      # uses) with no sample in the last 15m (three polls); it resolves 24h
      # after the last sample. The host
      # freshness guard leaves a whole-host outage to HostNotReporting, and
      # for: 10m covers the wait for Telegraf's first 5m SMART poll after a
      # host or agent restart. Warning, not critical: a removed disk looks the
      # same as a dead drive, so this needs a person to check.
      - alert: SmartDeviceNotReporting
        expr: |
          (
            max by (host, device) (present_over_time(smart_device_exit_status[24h]))
            unless
            max by (host, device) (present_over_time(smart_device_exit_status[15m]))
          )
          and on (host) (host:metrics_stale_seconds < 300)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SMART data stopped for {{ $labels.device }} on {{ $labels.host }}"
          description: >-
            {{ $labels.device }} on {{ $labels.host }} has sent no SMART data for 15 minutes
            while the host is still reporting; the disk may have failed or been removed.
            This alert clears by itself 24 hours after the last sample even if the disk is
            still missing, so a resolved notification does not mean the disk came back.

      # If every per-device query is refused (the sudoers rule does not match
      # the argv Telegraf runs, or the installed sudo) or smartctl rejects the
      # argv, only exit_status arrives: SmartDeviceNotReporting stays quiet and
      # the other rules go silent once their 24h lookback runs out. Telegraf
      # (smart.go v1.36.4) passes the exit code through as-is. sudo -n
      # refusing a command exits 1, and smartctl's bit 0 (value 1) means its
      # command line did not parse. smartctl can also return 1 for a device
      # it cannot open or identify, for example a USB disk behind a bridge it
      # does not recognise ("Unknown USB bridge ... specify device type with
      # -d"), because Telegraf passes only the scanned path with no -d; such
      # a disk can be skipped with excludes = ["/dev/sdX"] in inputs.smart in
      # client/Telegraf/telegraf.conf. Every other smartctl outcome is either
      # 0 or sets a higher bit (a disk asleep under -n standby exits 2, a
      # device it cannot query for SMART sets bit 2, a failing disk sets bit
      # 3 or above), so exit_status == 1 means no SMART data could be read,
      # with no idle-disk false alarms and no time window to tune.
      # last_over_time keeps only the newest poll of each series, and
      # min by (host, device) only combines series of the same disk, so the
      # newest poll decides: the alert is pending from the first poll that
      # exits 1 and resolves at the first poll that exits otherwise. If the
      # scan itself is refused, no device is listed and no exit_status
      # arrives, so this rule cannot fire; SmartDeviceNotReporting covers
      # that only for a disk seen in the last 24h, and a host whose scan
      # never worked is not alerted on. for: 30m (six polls) is the debounce:
      # it rides out a brief misconfiguration while a host is being set up.
      # Warning: a person must fix the host.
      - alert: SmartDataUnavailable
        expr: |
          min by (host, device) (
            last_over_time(smart_device_exit_status[15m])
          ) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SMART data cannot be read for {{ $labels.device }} on {{ $labels.host }}"
          description: >-
            smartctl for {{ $labels.device }} on {{ $labels.host }} exits 1, so no health or
            wear data is collected. Either sudo refused the command or smartctl rejected its
            arguments (check the sudoers rule installed by install.sh and the Telegraf
            version), or smartctl could not open or identify the device, for example a USB
            disk behind an unsupported USB bridge; such a disk can be skipped with excludes
            in inputs.smart in telegraf.conf.

      # Telegraf v1.36.4 writes NVMe "Percentage Used" (and the SAS
      # endurance indicator, which it maps to the same name) only to
      # smart_attribute; newer releases may also emit
      # smart_device_percentage_used. This rule reads smart_attribute, so it
      # needs telegraf.conf to keep attributes = true. Under -n standby
      # smartctl exits before the attribute table, so a sleeping disk emits
      # no smart_attribute; the 24h lookback (as SmartDeviceUnhealthy uses)
      # keeps the last reading so for: 1h does not restart while it sleeps.
      # Any smart_attribute tag beyond the disk's identity that changes
      # between polls starts a new series, and the old one lingers in the 24h
      # lookback; telegraf.conf drops the flipping power tag at source, and
      # max by the stable tags still keeps one alert per disk from its worst
      # reading if any other tag changes, so for: is not restarted or
      # duplicated. A replaced disk's old serial_no can still hold its last
      # reading for up to 24h; that is accepted.
      - alert: SmartDeviceWearHigh
        expr: |
          max by (host, device, model, serial_no) (
            last_over_time(smart_attribute_raw_value{name="Percentage_Used"}[24h])
          ) >= 90
        for: 1h
        labels:
          severity: warning
          wear_indicator: percentage_used
        annotations:
          summary: "NVMe/SAS device {{ $labels.device }} on {{ $labels.host }} is at least 90% worn"
          description: "{{ $labels.device }} ({{ $labels.model }} {{ $labels.serial_no }}) on {{ $labels.host }} has used {{ $value }}% of its endurance."

      # Telegraf fills these SATA smart_device fields from the normalised
      # VALUE column, not RAW_VALUE, so they count down from 100 to 0
      # (remaining life), the opposite direction to NVMe Percentage_Used.
      # A drive can report more than one of them; min by device gives one
      # alert per drive from its worst (lowest) reading rather than one per
      # attribute. These fields come from the attribute table, which smartctl
      # never reaches for a disk asleep under -n standby, so the 24h lookback
      # keeps the last reading and for: 1h does not restart while it sleeps.
      - alert: SmartDeviceWearHigh
        expr: |
          min by (host, device, model, serial_no) (
            last_over_time({__name__=~"smart_device_(wear_leveling_count|media_wearout_indicator|percent_lifetime_remain)"}[24h])
          ) <= 10
        for: 1h
        labels:
          severity: warning
          wear_indicator: remaining_life
        annotations:
          summary: "SSD {{ $labels.device }} on {{ $labels.host }} has 10% or less of its rated life remaining"
          description: "{{ $labels.device }} ({{ $labels.model }} {{ $labels.serial_no }}) on {{ $labels.host }} has {{ $value }}/100 life remaining."
