---
groups:
  - name: ingestion
    interval: 1m
    rules:
      - alert: MetricsIngestionStalled
        # 300s threshold is duplicated in host.rules.yml's HostNotReporting - keep both in sync.
        expr: count(host:metrics_stale_seconds < 300) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No hosts have reported metrics recently"
          description: "No monitored host has sent fresh metrics within 5 minutes; the ingestion pipeline may be down."
