---
groups:
  - name: host
    interval: 1m
    rules:
      - record: host:metrics_stale_seconds
        expr: time() - timestamp(last_over_time(cpu_usage_idle{cpu="cpu-total"}[30m]))

      - alert: HostNotReporting
        # 300s threshold is duplicated in ingestion.rules.yml's MetricsIngestionStalled - keep both in sync.
        expr: host:metrics_stale_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.host }} is not reporting metrics"
          description: "No metrics have been received from host {{ $labels.host }} for over 5 minutes."
