---
global:
  # Above the slowest vmalert rule-group interval (docker/resources: 5m) so
  # evaluation jitter can't create a gap that exceeds this and falsely
  # auto-resolves a still-firing alert.
  resolve_timeout: 15m

route:
  receiver: chat-webhook
  group_by: ["alertname", "host"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: chat-webhook
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"
