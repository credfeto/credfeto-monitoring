---
route:
  receiver: chat-webhook
  group_by: ["alertname", "host"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: chat-webhook
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"
