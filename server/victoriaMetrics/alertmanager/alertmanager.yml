---
global:
  # Above the slowest vmalert rule-group interval (docker/resources: 5m) so
  # evaluation jitter can't create a gap that exceeds this and falsely
  # auto-resolves a still-firing alert.
  resolve_timeout: 15m

route:
  receiver: chat-webhook
  group_by: ["alertname", "host"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Every alert also goes to the Familiar agent's webhook, which looks into
    # it and reports the cause. continue: true lets the next route match too.
    - receiver: familiar-webhook
      continue: true
    # The chat webhook still gets every alert, as before.
    - receiver: chat-webhook

receivers:
  # The webhook is a Discord webhook. Alertmanager's slack_configs posted a
  # Slack payload that Discord rejected (400 {"attachments": ["0"]}) on every
  # notification, so nothing was ever delivered; use the native Discord
  # integration instead.
  - name: chat-webhook
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.host }} on {{ . }}{{ end }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

  # The Familiar agent's inbound webhook. The URL is a secret: it lives in
  # alertmanager/familiar_webhook_url on the host (gitignored, never committed).
  # While that file is empty, sends to this receiver fail and are logged;
  # the chat webhook is unaffected.
  - name: familiar-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/familiar_webhook_url
        send_resolved: true
        max_alerts: 50
