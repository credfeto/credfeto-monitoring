---
x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  # Keeps the :latest images (the MCP servers) up to date. Pinned images are
  # left alone: Watchtower only pulls a newer image for the same tag.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    environment:
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: monitoring
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "${WATCHTOWER_SCHEDULE:-0 17 * * * *}"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/storage
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=12
    restart: always

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    container_name: victorialogs
    ports:
      - "9428:9428"
      - "514:5140/tcp"
      - "514:5140/udp"
    volumes:
      - victoria-logs-data:/vlogs
    command:
      - --storageDataPath=/vlogs
      - --retentionPeriod=${VICTORIALOGS_RETENTION:-30d}
      - --syslog.listenAddr.tcp=:5140
      - --syslog.listenAddr.udp=:5140
      # Record the sender as remote_ip: several senders (e.g. every Technitium
      # node, which reports the hostname "dns-server") share a syslog hostname.
      - --syslog.useRemoteIP.tcp=true
      - --syslog.useRemoteIP.udp=true
    <<: *hardened
    restart: always

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    depends_on:
      - victoriametrics
      - victorialogs
    env_file: .env
    environment:
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource@0.34.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: always

  vmalert:
    image: victoriametrics/vmalert:v1.111.0
    container_name: vmalert
    depends_on:
      - victoriametrics
      - alertmanager
    ports:
      - "8880:8880"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    command:
      - --datasource.url=http://victoriametrics:8428
      - --remoteWrite.url=http://victoriametrics:8428
      - --remoteRead.url=http://victoriametrics:8428
      - --notifier.url=http://alertmanager:9093
      - --rule=/etc/vmalert/rules/*.yml
    <<: *hardened
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/webhook_url:/etc/alertmanager/secrets/webhook_url:ro
      - ./alertmanager/familiar_webhook_url:/etc/alertmanager/secrets/familiar_webhook_url:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    <<: *hardened
    restart: always

  mcp-victoriametrics:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
    container_name: mcp-victoriametrics
    depends_on:
      - victoriametrics
    ports:
      - "8081:8081"
    environment:
      VM_INSTANCE_ENTRYPOINT: http://victoriametrics:8428
      VM_INSTANCE_TYPE: single
      MCP_SERVER_MODE: http
      MCP_LISTEN_ADDR: ":8081"
      # Callers must send "Authorization: Bearer <token>" (401 otherwise).
      MCP_AUTH_TOKEN: ${MCP_VICTORIAMETRICS_AUTH_TOKEN:?set MCP_VICTORIAMETRICS_AUTH_TOKEN in .env}
    <<: *hardened
    restart: always

  mcp-victorialogs:
    image: ghcr.io/victoriametrics/mcp-victorialogs:latest
    container_name: mcp-victorialogs
    depends_on:
      - victorialogs
    ports:
      - "8083:8083"
    environment:
      VL_INSTANCE_ENTRYPOINT: http://victorialogs:9428
      MCP_SERVER_MODE: http
      MCP_LISTEN_ADDR: ":8083"
      # Callers must send "Authorization: Bearer <token>". mcp-victorialogs
      # v1.10.0 ignores this (support is on upstream main, not yet released);
      # it is enforced from the first release that includes it.
      MCP_AUTH_TOKEN: ${MCP_VICTORIALOGS_AUTH_TOKEN:?set MCP_VICTORIALOGS_AUTH_TOKEN in .env}
    <<: *hardened
    restart: always

  vmauth-funfair:
    image: victoriametrics/vmauth:v1.111.0
    container_name: vmauth-funfair
    depends_on:
      - victoriametrics
    volumes:
      - ./vmauth/funfair.yml:/etc/vmauth/funfair.yml:ro
    command:
      - --auth.config=/etc/vmauth/funfair.yml
      - --httpListenAddr=:8427
    <<: *hardened
    restart: always

  mcp-victoriametrics-funfair:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
    container_name: mcp-victoriametrics-funfair
    depends_on:
      - vmauth-funfair
    ports:
      - "8084:8084"
    environment:
      VM_INSTANCE_ENTRYPOINT: http://vmauth-funfair:8427
      VM_INSTANCE_TYPE: single
      MCP_SERVER_MODE: http
      MCP_LISTEN_ADDR: ":8084"
      # yamllint disable-line rule:line-length
      MCP_DISABLED_TOOLS: export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules,active_queries,alerts,rules,metric_statistics,metrics_metadata,tsdb_status,top_queries,tenants
      # Callers send the token in the Authorization header; the reverse
      # proxies check the same value first.
      MCP_AUTH_TOKEN: ${MCP_FUNFAIR_AUTH_TOKEN:-}
    <<: *hardened
    restart: always

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    depends_on:
      - grafana
    ports:
      - "8082:8000"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      # Caller auth: requests without "Authorization: Bearer <token>" get 401.
      # Set via the environment rather than --server-auth-token so the secret
      # is not visible in the process arguments.
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN:?set MCP_GRAFANA_SERVER_TOKEN in .env}
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --allowed-hosts=${MCP_GRAFANA_ALLOWED_HOSTS:-localhost:8082,127.0.0.1:8082}
      - --disable-write
    <<: *hardened
    restart: always

volumes:
  victoria-metrics-data:
    external: true
  victoria-logs-data:
    external: true
  grafana-data:
    external: true
  alertmanager-data:
    external: true
