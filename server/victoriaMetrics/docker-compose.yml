---
x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/storage
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    depends_on:
      - victoriametrics
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  vmalert:
    image: victoriametrics/vmalert:v1.111.0
    container_name: vmalert
    depends_on:
      - victoriametrics
      - alertmanager
    ports:
      - "8880:8880"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    command:
      - --datasource.url=http://victoriametrics:8428
      - --remoteWrite.url=http://victoriametrics:8428
      - --remoteRead.url=http://victoriametrics:8428
      - --notifier.url=http://alertmanager:9093
      - --rule=/etc/vmalert/rules/*.yml
    <<: *hardened
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/webhook_url:/etc/alertmanager/secrets/webhook_url:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    <<: *hardened
    restart: unless-stopped

  mcp-victoriametrics:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.21.0
    container_name: mcp-victoriametrics
    depends_on:
      - victoriametrics
    ports:
      - "8081:8081"
    environment:
      VM_INSTANCE_ENTRYPOINT: http://victoriametrics:8428
      VM_INSTANCE_TYPE: single
      MCP_SERVER_MODE: http
      MCP_LISTEN_ADDR: ":8081"
    <<: *hardened
    restart: unless-stopped

  mcp-grafana:
    image: grafana/mcp-grafana:2.3.0
    container_name: mcp-grafana
    depends_on:
      - grafana
    ports:
      - "8082:8000"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --disable-write
    <<: *hardened
    restart: unless-stopped

volumes:
  victoria-metrics-data:
    external: true
  grafana-data:
    external: true
  alertmanager-data:
    external: true
