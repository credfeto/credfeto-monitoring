[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false
  skip_processors_after_aggregators = false

[[outputs.influxdb]]
  urls = ["https://monitoring.markridgwell.com"]
  database = "telegraf"
  skip_database_creation = true
  timeout = "5s"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "nsfs", "efivarfs"]

[[inputs.diskio]]

[[inputs.mem]]

[[inputs.net]]

[[inputs.system]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service"]
  docker_label_exclude = []

# SMART health and wear change slowly, and each poll spawns smartctl per
# device, so the 10s agent interval would be wasted work.
[[inputs.smart]]
  interval = "5m"
  use_sudo = true
  attributes = true
  timeout = "30s"
  # The power tag (ACTIVE/IDLE/STANDBY) changes between polls, which would
  # split one disk into several series; the alert rules' 24h lookback would
  # then keep an old series (such as a failed health_ok) alive after it
  # stopped being current, so drop it from every smart measurement.
  tagexclude = ["power"]
